<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data: https:; connect-src 'self' https: wss:; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Okto — планер, задачи и фокус</title>
    <script>
      try {
        const v3 = JSON.parse(localStorage.getItem('okto-v3') || 'null');
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = v3?.data?.settings?.theme;
        document.documentElement.dataset.theme = theme && theme !== 'system' ? theme : (dark ? 'dark' : 'light');
      } catch { /* Use the default theme. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
