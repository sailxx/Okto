<!doctype html>
<meta charset="utf-8">
<title>Okto demo seed</title>
<script>
// Демо-данные для скриншотов README: кладём в localStorage и открываем экран.
// Используется только локально (node tools/readme/shots.mjs), в приложение не попадает.
(function () {
  var q = new URLSearchParams(location.search);
  var lang = q.get("lang") === "en" ? "en" : "ru";
  var to = q.get("to") || "";
  var view = q.get("view") || "day";
  var ru = lang === "ru";
  var D = 86400000, now = Date.now();
  function key(off) { var d = new Date(now + off * D); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  var t0 = key(0);
  var n = 0;
  function task(p) {
    n++;
    var base = { id: "t" + n, title: "", note: "", listId: "personal", priority: 0, date: t0, start: null, duration: 30, subtasks: [], repeat: null,
      reminder: null, done: false, doneAt: null, doneDates: [], skipDates: [], focusMinutes: 0, createdAt: now - 20 * D, updatedAt: now, deleted: false };
    for (var k in p) base[k] = p[k];
    return base;
  }
  var T = ru ? {
    run: "Утренняя пробежка", report: "Отчёт для клиента", call: "Созвон с командой", shop: "Купить продукты", read: "Прочитать 20 страниц",
    gym: "Спортзал", plan: "План на неделю", s1: "Собрать цифры", s2: "Графики", s3: "Отправить", push: "Отжимания", name: "Влад", work: "Работа", personal: "Личное"
  } : {
    run: "Morning run", report: "Client report", call: "Team call", shop: "Buy groceries", read: "Read 20 pages",
    gym: "Gym", plan: "Plan the week", s1: "Collect numbers", s2: "Charts", s3: "Send", push: "Push-ups", name: "Vlad", work: "Work", personal: "Personal"
  };
  var tasks = [
    task({ title: T.run, start: "07:30", duration: 30, repeat: { freq: "day", interval: 1, until: null }, doneDates: [key(0), key(-1), key(-2), key(-3)] }),
    task({ title: T.report, listId: "work", start: "10:00", duration: 90, priority: 3, focusMinutes: 50,
      subtasks: [{ id: "s1", title: T.s1, done: true }, { id: "s2", title: T.s2, done: true }, { id: "s3", title: T.s3, done: false }] }),
    task({ title: T.call, listId: "work", start: "13:00", duration: 45, done: true, doneAt: now - 2 * 3600000 }),
    task({ title: T.shop, start: "18:00", duration: 30, priority: 1, reminder: 15 }),
    task({ title: T.read, start: "21:00", duration: 30, repeat: { freq: "day", interval: 1, until: null }, doneDates: [key(-1), key(-2)] }),
    task({ title: T.gym, date: key(1), start: "19:00", duration: 60 }),
    task({ title: T.plan, listId: "work", date: key(2), start: "09:00", duration: 30, priority: 2 })
  ];
  // Выполненные задачи прошлых дней — для графиков на главной
  var past = [2, 3, 1, 4, 2, 3, 5, 2, 4, 3, 1, 3, 4];
  past.forEach(function (c, i) {
    for (var j = 0; j < c; j++) tasks.push(task({ title: "—", date: key(-(i + 1)), done: true, doneAt: now - (i + 1) * D }));
  });
  var data = { tasks: {}, lists: {}, sessions: {}, counters: {}, settings: {} };
  tasks.forEach(function (t) { data.tasks[t.id] = t; });
  data.lists = {
    personal: { id: "personal", name: T.personal, color: "#0090ff", order: 0, updatedAt: 0, deleted: false },
    work: { id: "work", name: T.work, color: "#8e4ec6", order: 1, updatedAt: 0, deleted: false }
  };
  var mins = [75, 50, 100, 25, 75, 125, 50];
  mins.forEach(function (m, i) {
    for (var s = 0; s < m / 25; s++) {
      var id = "f" + i + "_" + s;
      data.sessions[id] = { id: id, start: now - i * D - (s + 1) * 1800000, minutes: 25, taskId: i === 0 && s === 0 ? "t2" : null, updatedAt: now, deleted: false };
    }
  });
  var daily = {};
  [60, 80, 100, 70, 100, 90, 40].forEach(function (v, i) { daily[key(-i)] = v; });
  data.counters = { c1: { id: "c1", name: T.push, target: 100, step: 10, count: 60, color: "#e5484d", history: [], daily: daily, order: 0, updatedAt: now, deleted: false } };
  data.settings = { id: "main", lang: lang, theme: "light", notify: false, sound: true, vibrate: true, name: T.name, greeting: "", onboarded: true,
    pomo: { preset: "classic", custom: { work: 25, short: 5, long: 15, every: 4 }, autoStart: false },
    dashboard: [{ type: "tasks" }, { type: "focus" }, { type: "streak" }, { type: "next" }, { type: "counter", counterId: "c1" }], hiddenLists: [], updatedAt: now };
  var device = { focusMode: "pomodoro", activeCounter: "c1", locked: false, stopwatch: { elapsed: 0, startedAt: null },
    pomo: { phase: "work", round: 2, remaining: null, endsAt: null }, focusTask: null, calView: view, taskFilter: "today" };
  localStorage.clear();
  localStorage.setItem("okto-v3", JSON.stringify({ v: 3, data: data, device: device }));
  location.replace("./index.html#/" + to);
})();
</script>
