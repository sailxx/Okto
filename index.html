<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <meta name="description" content="Okto — простой счётчик с тёмной и светлой темой." />
    <title>Okto — счётчик</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ВАШ ЛИЧНЫЙ СЧЁТЧИК</p>
          <h1>Okto</h1>
        </div>
        <button class="icon-button settings-trigger" id="settingsButton" aria-label="Настройки" title="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 13.5 1.3 1-.0 0-1.4 2.4-1.6-.6a7.9 7.9 0 0 1-1.5.9l-.3 1.7h-2.8l-.3-1.7a7.9 7.9 0 0 1-1.5-.9l-1.6.6-1.4-2.4 1.3-1a7.5 7.5 0 0 1 0-1.8l-1.3-1 1.4-2.4 1.6.6a7.9 7.9 0 0 1 1.5-.9l.3-1.7h2.8l.3 1.7a7.9 7.9 0 0 1 1.5.9l1.6-.6 1.4 2.4-1.3 1a7.5 7.5 0 0 1 0 1.8Z" transform="translate(-1.1 -1.1) scale(1.09)"/></svg>
        </button>
      </header>

      <section class="counter" aria-label="Счётчик">
        <div class="progress-row">
          <div>
            <p class="section-label">ЦЕЛЬ</p>
            <p class="target-value"><span id="targetValue">75</span> <span class="target-unit">нажатий</span></p>
          </div>
          <div class="progress-ring" id="progressRing" role="img" aria-label="Прогресс: 0 процентов">
            <span id="progressPercent">0%</span>
          </div>
        </div>

        <button class="count-display" id="countButton" aria-label="Нажмите, чтобы увеличить счётчик">
          <span class="count-number" id="countValue" aria-live="polite">0</span>
          <span class="tap-hint">НАЖМИТЕ, ЧТОБЫ СЧИТАТЬ</span>
        </button>

        <div class="controls" aria-label="Управление счётчиком">
          <button class="round-button" id="undoButton" aria-label="Уменьшить на один" title="Уменьшить на один">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
          </button>
          <button class="round-button" id="resetButton" aria-label="Сбросить счётчик" title="Сбросить счётчик">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="round-button" id="themeButton" aria-label="Включить тёмную тему" title="Переключить тему">
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.8 8.8 0 1 0 20.2 15.2Z"/><path d="M17.5 3v5M15 5.5h5"/></svg>
          </button>
          <button class="round-button" id="moreButton" aria-label="Дополнительные действия" title="Дополнительные действия">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
        <p class="helper-text">КАЖДОЕ НАЖАТИЕ — ЕЩЁ ОДИН ШАГ</p>
      </section>
    </main>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog" class="dialog-content" id="settingsForm">
        <div class="dialog-heading">
          <button class="back-button" value="cancel" aria-label="Закрыть настройки">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2 id="settingsTitle">Настройки</h2>
          <span class="heading-spacer"></span>
        </div>
        <label class="setting-row" for="targetInput">
          <span><strong>Цель</strong><small>Количество нажатий</small></span>
          <input id="targetInput" type="number" min="1" max="999999" value="75" inputmode="numeric" />
        </label>
        <button class="setting-row theme-setting" id="themeSetting" type="button">
          <span><strong>Оформление</strong><small id="themeDescription">Светлая тема</small></span>
          <span class="setting-arrow" aria-hidden="true">›</span>
        </button>
        <p class="dialog-note">Ваш счёт сохраняется на этом устройстве.</p>
        <button class="save-button" value="save">Готово</button>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
