<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fafafa" />
    <title>Okto — счётчик в один тап</title>
    <meta name="description" content="Okto — минималистичный онлайн‑счётчик: тап по экрану, цель, секундомер, отмена и тёмная тема. Без регистрации, рекламы и трекеров." />
    <meta property="og:title" content="Okto — счётчик в один тап" />
    <meta property="og:description" content="Минималистичный счётчик в браузере: тап — плюс один. Цель, секундомер, отмена, тёмная тема. Без регистрации." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sailxx.github.io/Okto/" />
    <meta property="og:image" content="https://sailxx.github.io/Okto/assets/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="assets/fonts/InterDisplay-Bold.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('okto-counter-v1') || '{}');
        document.documentElement.dataset.theme = s.theme === 'dark' || s.theme === 'light'
          ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { /* ignore */ }
    </script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <a class="brand" href="./" aria-label="Okto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/></svg>
          <span>okto</span>
        </a>
        <button class="icon-btn" id="settingsButton" type="button" aria-label="Настройки" title="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
      </header>

      <section class="heading">
        <button class="name" id="nameButton" type="button" aria-label="Переименовать счётчик">Счётчик</button>
        <p class="meta" id="meta">Цель 75</p>
      </section>

      <main class="zone" id="zone">
        <div class="block">
          <button class="count" id="countButton" type="button" aria-label="Прибавить 1"><span id="digits">0</span></button>
          <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
          <div class="progress-line">
            <span id="progressText">0 из 75</span>
            <span id="progressPercent">0%</span>
          </div>
        </div>
      </main>

      <footer class="bottom">
        <p class="hint" id="hint">Тап — счёт · удержание — сброс</p>
        <nav class="toolbar" aria-label="Управление">
          <button class="tool" id="lockButton" type="button" aria-pressed="false" aria-label="Заблокировать счёт" title="Блокировка">
            <svg class="i-open" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 6.8-1.2"/></svg>
            <svg class="i-closed" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
          </button>
          <button class="tool" id="undoButton" type="button" aria-label="Отменить" title="Отменить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button class="tool timer" id="timerButton" type="button" aria-label="Запустить секундомер" title="Секундомер">
            <span class="dot" aria-hidden="true"></span><span id="timerValue">00:00</span>
          </button>
          <button class="tool text" id="stepButton" type="button" aria-label="Шаг: 1" title="Шаг">+1</button>
          <button class="tool" id="themeButton" type="button" aria-label="Тёмная тема" title="Тема">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          </button>
        </nav>
      </footer>
    </div>

    <dialog class="sheet" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog" id="settingsForm">
        <div class="sheet-head">
          <h2 id="settingsTitle">Настройки</h2>
          <button class="icon-btn" value="cancel" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <label class="field"><span>Название</span><input id="nameInput" type="text" maxlength="32" placeholder="Например, отжимания" autocomplete="off" /></label>
        <label class="field"><span>Цель</span><input id="targetInput" type="number" min="1" max="999999" inputmode="numeric" /></label>
        <div class="sheet-links">
          <button class="link-btn" id="timerReset" type="button">Сбросить секундомер</button>
          <button class="link-btn" id="shareButton" type="button">Поделиться</button>
        </div>
        <button class="solid-btn" value="save">Готово</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
