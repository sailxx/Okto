<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>Okto — планер, задачи и фокус</title>
    <meta name="description" content="Okto — минималистичный планер: задачи, календарь, Pomodoro и счётчик. Бесплатно, без рекламы." />
    <meta property="og:title" content="Okto — планер, задачи и фокус" />
    <meta property="og:description" content="Задачи, календарь, Pomodoro и счётчик в одном минималистичном приложении." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sailxx.github.io/Okto/" />
    <meta property="og:image" content="https://sailxx.github.io/Okto/assets/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./assets/fonts/InterDisplay-Bold.woff" as="font" type="font/woff" crossorigin />
    <script>
      try {
        const v3 = JSON.parse(localStorage.getItem('okto-v3') || 'null');
        const s = v3 ? { theme: v3.data && v3.data.settings && v3.data.settings.theme } : JSON.parse(localStorage.getItem('okto-v2') || localStorage.getItem('okto-counter-v1') || '{}');
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = s.theme && s.theme !== 'system' ? s.theme : (dark ? 'dark' : 'light');
      } catch { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
